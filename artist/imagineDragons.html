    <section class="content-artista">

            <img src="https://res.cloudinary.com/dcqr7yd84/image/upload/v1746932336/posterMana_rwqvud.jpg" alt="" class="portada-img">
            <h3>Imagine Dragons</h3>
        </div>
        <div class="content-list-music" onclick="changeMusic(this)">
            <img src="https://res.cloudinary.com/dcqr7yd84/image/upload/v1746988231/whatever_it_takes_zq4oey.jpg" alt="" class="poster-img">
            <h3>Whatever It Takes</h3>
        </div>
        <div class="content-list-music" onclick="changeMusic(this)">

        </div>

                    <h2 class="reproductor-nombre-cancion">
                        Whatever It Takes
                    </h2>
                    <h3 class="reprodutor-nombre-artista">
                        Imagine Dragons

            </div>
            <div class="reproductor-content-audio-control">

        <div class="reproductor-content-video">
            <iframe src="https://www.youtube.com/embed/gOsM-DYAEhY?si=PgJYcEIMuwCZC55d" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
